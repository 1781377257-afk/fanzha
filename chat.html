<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>反诈小安 · 正在接通</title>
<style>
  :root{
    --bg1:#f7fbff;--bg2:#e8f1fb;--txt:#1a2740;--sub:#64748b;
    --brand:#1a6fd4;--line:rgba(26,60,110,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:rgba(255,255,255,.86);
    border-bottom:1px solid var(--line);backdrop-filter:blur(12px);
  }
  .logo{
    width:32px;height:32px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(140deg,#37b6ff,#1a6fd4);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
    box-shadow:0 6px 16px rgba(26,111,212,.28);
  }
  header h1{font-size:14.5px;font-weight:700;letter-spacing:.5px}
  header p{font-size:11px;color:var(--sub);margin-top:1px}
  .back{
    margin-left:auto;font-size:12px;color:var(--brand);text-decoration:none;
    padding:6px 10px;border-radius:9px;background:rgba(26,111,212,.08);
  }

  main{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:12px;padding:24px 18px;position:relative}

  .avatar{
    width:64px;height:64px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(140deg,#37b6ff,#1a6fd4);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;
    box-shadow:0 14px 34px rgba(26,111,212,.30);
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .name{font-size:13px;font-weight:700;letter-spacing:.5px;color:#20406e}
  .state{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:#2fd39a;animation:blink 1.2s infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  .chatwrap{width:100%;max-width:340px;display:flex;flex-direction:column;gap:9px;margin-top:6px}
  .bub{
    max-width:80%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.7;
    background:#fff;border:1px solid rgba(26,60,110,.08);
    box-shadow:0 6px 18px rgba(20,50,90,.06);
    opacity:0;transform:translateY(8px) scale(.96);
    animation:pop .34s cubic-bezier(.2,.9,.3,1) forwards;
  }
  .bub.me{
    align-self:flex-end;background:linear-gradient(140deg,#37b6ff,#1a6fd4);
    color:#fff;border-color:transparent;
  }
  .bub.you{align-self:flex-start}
  @keyframes pop{to{opacity:1;transform:none}}

  .hint{margin-top:14px;font-size:11.5px;color:#94a3b8;letter-spacing:.5px}
  .fail{display:none;flex-direction:column;align-items:center;gap:12px;margin-top:16px}
  .fail.on{display:flex}
  .fail a{
    display:inline-block;padding:12px 24px;border-radius:13px;text-decoration:none;
    background:linear-gradient(140deg,#37b6ff,#1a6fd4);color:#fff;
    font-size:14px;font-weight:700;letter-spacing:.5px;
    box-shadow:0 12px 28px rgba(26,111,212,.28);
  }
</style>
</head>
<body>

<header>
  <div class="logo">安</div>
  <div>
    <h1>反诈小安</h1>
    <p>内蒙古自治区 · 校园反诈服务台</p>
  </div>
  <a class="back" href="index.html">返回</a>
</header>

<main>
  <div class="avatar">安</div>
  <div class="name">反诈小安</div>
  <div class="state"><span class="dot"></span><span id="stateTxt">正在接通…</span></div>

  <div class="chatwrap">
    <div class="bub you">在吗？我想练一次。</div>
    <div class="bub me" id="b2">在的。说「练一下」，我扮骗子，你试着识破我。</div>
  </div>

  <div class="hint" id="hint">正在打开对话窗口…</div>

  <div class="fail" id="fail">
    <div class="hint">窗口没有自动打开，点下面按钮进入。</div>
    <a id="jump" href="#">进入对话 →</a>
  </div>
</main>

<audio id="ding" src="audio/ding.wav" preload="auto"></audio>

<script type="text/javascript">
(function(){
  var COZE = "https://robot.chaoxing.com/coze?unitId=353067&robotId=6a2a1689c92a4e49be27b47a640538ae";
  var ding = document.getElementById('ding');
  var b2 = document.getElementById('b2');
  var jump = document.getElementById('jump');
  var fail = document.getElementById('fail');
  var hint = document.getElementById('hint');
  var stateTxt = document.getElementById('stateTxt');
  if (jump) jump.href = COZE;

  function playDing(){
    if (!ding) return;
    try { ding.currentTime = 0; ding.volume = 0.55; ding.play().catch(function(){}); } catch(e){}
  }

  if (b2) b2.style.animationDelay = '0.55s';

  // 两条消息各响一次
  setTimeout(playDing, 240);
  setTimeout(playDing, 820);
  setTimeout(function(){ if (stateTxt) stateTxt.textContent = '即将进入对话…'; }, 1100);

  // 自动播放被拦时，用户点一下也能出声
  document.addEventListener('pointerdown', function once(){
    playDing();
    document.removeEventListener('pointerdown', once);
  }, {passive:true});

  // 1.7 秒后跳转
  setTimeout(function(){
    try { window.location.replace(COZE); } catch(e){}
  }, 1700);

  // 4.5 秒还没跳走 → 给按钮
  setTimeout(function(){
    if (hint) hint.style.display = 'none';
    if (fail) fail.classList.add('on');
  }, 4500);
})();
</script>
</body>
</html>
