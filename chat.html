<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>反诈小安 · 对话</title>
<style>
  :root{
    --bg1:#f7fbff;--bg2:#e8f1fb;--txt:#1a2740;--sub:#64748b;
    --brand:#1a6fd4;--line:rgba(26,60,110,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 16px;background:rgba(255,255,255,.86);
    border-bottom:1px solid var(--line);backdrop-filter:blur(12px);
  }
  .logo{
    width:32px;height:32px;border-radius:10px;flex:0 0 auto;
    background:linear-gradient(140deg,#37b6ff,#1a6fd4);
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;
    box-shadow:0 6px 16px rgba(26,111,212,.28);
  }
  header h1{font-size:14.5px;font-weight:700;letter-spacing:.5px}
  header p{font-size:11px;color:var(--sub);margin-top:1px}
  .back{
    margin-left:auto;font-size:12px;color:var(--brand);text-decoration:none;
    padding:6px 10px;border-radius:9px;background:rgba(26,111,212,.08);
  }

  main{flex:1 1 auto;position:relative;overflow:hidden}
  #bot{width:100%;height:100%}
  #bot iframe{width:100%!important;height:100%!important;border:0}

  /* 加载中 */
  .loading{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;color:var(--sub);
    font-size:12.5px;pointer-events:none;transition:opacity .4s;
  }
  .spin{
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid rgba(26,111,212,.18);border-top-color:var(--brand);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading.gone{opacity:0}

  /* 兜底 */
  .fallback{
    position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;
  }
  .fallback.on{display:flex}
  .fallback .em{font-size:30px}
  .fallback h2{font-size:16px;font-weight:700}
  .fallback p{font-size:12.5px;color:var(--sub);line-height:1.8;max-width:290px}
  .fallback a{
    display:inline-block;padding:13px 26px;border-radius:13px;text-decoration:none;
    background:linear-gradient(140deg,#37b6ff,#1a6fd4);color:#fff;
    font-size:14.5px;font-weight:700;letter-spacing:.5px;
    box-shadow:0 12px 28px rgba(26,111,212,.28);
  }
  .tip{margin-top:6px;font-size:11px;color:#94a3b8}
</style>
</head>
<body>

<header>
  <div class="logo">安</div>
  <div>
    <h1>反诈小安</h1>
    <p>内蒙古师范大学 · 校园反诈服务台</p>
  </div>
  <a class="back" href="index.html">返回</a>
</header>

<main>
  <div id="bot"></div>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>正在连接小安…</div>
  </div>

  <div class="fallback" id="fallback">
    <div class="em">🔌</div>
    <h2>对话窗口没加载出来</h2>
    <p>可能是网络或浏览器限制。直接点下面按钮，在新的页面和小安对话。</p>
    <a id="jump" href="#">进入对话 →</a>
    <div class="tip">功能完全一样</div>
  </div>
</main>

<!-- 超星智能体 Web SDK -->
<script type="text/javascript" src="https://robot.chaoxing.com/sdk/CxRobotSdk.js"></script>
<script type="text/javascript">
(function(){
  var EMBED = 'https://robot.chaoxing.com/embedChat?unitId=353067&robotId=6a2a1689c92a4e49be27b47a640538ae&groupId=0&openType=openUrl&openPage=coze';
  var KEY   = '2ac7e2cdb92ee45dc442d13cc3a840e7';
  var FULL  = 'https://robot.chaoxing.com/prime?unitId=353067&robotId=6a2a1689c92a4e49be27b47a640538ae';

  var loading = document.getElementById('loading');
  var fallback = document.getElementById('fallback');
  document.getElementById('jump').href = FULL;

  var ok = false;

  function fail(){
    if (ok) return;
    loading.classList.add('gone');
    fallback.classList.add('on');
  }

  try{
    if (window.CxRobotSdk && CxRobotSdk.js && typeof CxRobotSdk.js.init === 'function'){
      CxRobotSdk.js.init(EMBED, KEY);
      ok = true;
      setTimeout(function(){ loading.classList.add('gone'); }, 1200);
      // 再检查一次是否真的渲染出了 iframe
      setTimeout(function(){
        var el = document.getElementById('bot');
        if (!el.querySelector('iframe')){
          ok = false;
          fail();
        }
      }, 6000);
    } else {
      setTimeout(fail, 600);
    }
  } catch(e){
    setTimeout(fail, 300);
  }

  // SDK 脚本本身加载失败
  window.addEventListener('error', function(ev){
    if (ev && ev.target && ev.target.tagName === 'SCRIPT') fail();
  }, true);

  setTimeout(fail, 9000);
})();
</script>
</body>
</html>
