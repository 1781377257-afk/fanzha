<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>来电号码自查 · 反诈小安</title>
<style>
  :root{
    --bg:#05080f;--txt:#eef4ff;--sub:#8ea3c2;--dim:#5b708f;
    --brand:#37b6ff;--ok:#2fd39a;--bad:#ff5b5b;--warn:#ffbf47;
    --line:rgba(255,255,255,.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:
      radial-gradient(900px 500px at 50% -8%, #12305a 0%, transparent 62%),
      linear-gradient(180deg,var(--bg),#060a11 60%);
    color:var(--txt);min-height:100vh;padding:18px 16px 46px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:480px;margin:0 auto}

  header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .back{
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:rgba(255,255,255,.06);color:#9fbbdc;text-decoration:none;font-size:16px;flex:0 0 auto;
  }
  header h1{font-size:15px;font-weight:700;letter-spacing:.5px}
  header p{font-size:10.5px;color:var(--dim);margin-top:2px}

  .lede{font-size:13px;line-height:1.95;color:var(--sub);margin-bottom:20px}
  .lede b{color:#cfe6ff;font-weight:600}

  .inputbox{
    background:linear-gradient(180deg,rgba(20,34,56,.72),rgba(10,18,32,.8));
    border:1px solid rgba(120,180,255,.20);border-radius:18px;padding:18px 16px;
  }
  label{display:block;font-size:11px;letter-spacing:2px;color:#6f8bb0;margin-bottom:10px}
  .field{display:flex;gap:10px}
  input[type="tel"]{
    flex:1;min-width:0;background:rgba(255,255,255,.055);border:1px solid var(--line);
    border-radius:12px;padding:15px 14px;color:#eef4ff;font-size:19px;letter-spacing:2px;
    font-family:inherit;font-variant-numeric:tabular-nums;
    outline:none;transition:border-color .2s,background .2s;
  }
  input::placeholder{color:#42566f;letter-spacing:1px;font-size:14px}
  input:focus{border-color:rgba(55,182,255,.6);background:rgba(55,182,255,.07)}
  .btn{
    flex:0 0 auto;padding:0 22px;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(140deg,#37b6ff,#1a6fd4);color:#fff;font-size:14.5px;font-weight:700;
    font-family:inherit;letter-spacing:1px;box-shadow:0 10px 24px rgba(55,182,255,.26);
  }
  .btn:active{transform:scale(.98)}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .quick span{
    font-size:11px;color:#7f97b5;border:1px dashed rgba(255,255,255,.12);
    border-radius:8px;padding:5px 10px;cursor:pointer;
  }
  .quick span:hover{color:#9fd0ff;border-color:rgba(55,182,255,.4)}

  /* 结果 */
  .res{margin-top:18px;display:none}
  .res.on{display:block;animation:up .4s cubic-bezier(.2,.9,.3,1) both}
  @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .card{
    border-radius:18px;padding:20px 18px;border:1px solid var(--line);
    background:linear-gradient(160deg,rgba(24,40,62,.72),rgba(10,18,30,.82));
  }
  .card.high{border-color:rgba(255,91,91,.45);background:linear-gradient(160deg,rgba(58,20,24,.7),rgba(24,10,12,.85))}
  .card.mid{border-color:rgba(255,191,71,.40);background:linear-gradient(160deg,rgba(52,40,16,.65),rgba(24,18,8,.85))}
  .card.low{border-color:rgba(47,211,154,.40);background:linear-gradient(160deg,rgba(16,46,38,.62),rgba(8,22,18,.85))}

  .lv{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .lv .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .lv b{font-size:12px;letter-spacing:2px}
  .num{font-size:22px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;margin-bottom:6px}
  .kind{font-size:12px;color:var(--sub);margin-bottom:14px}

  .why{font-size:12.5px;line-height:1.9;color:#cfdcf4}
  .why .li{display:flex;gap:8px;margin-bottom:8px}
  .why .li i{
    width:16px;height:16px;border-radius:5px;flex:0 0 auto;display:grid;place-items:center;
    font-size:9px;font-style:normal;background:rgba(255,255,255,.08);color:#a9bcd6;margin-top:2px;
  }

  .acts{margin-top:16px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
  .acts h4{font-size:11px;letter-spacing:2px;color:#7f97b5;margin-bottom:10px}
  .acts .a{display:flex;gap:9px;font-size:12.5px;line-height:1.8;color:#c2d4ea;margin-bottom:8px}
  .acts .a b{color:#5fc0ff;font-weight:700}

  /* 官方号码表 */
  .t{display:flex;align-items:center;gap:8px;margin:30px 0 12px}
  .t::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}
  .t span{font-size:13px;font-weight:700;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .oi{
    background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;text-decoration:none;color:inherit;display:block;
  }
  .oi b{display:block;font-size:15px;font-weight:800;color:#cfe6ff;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .oi span{display:block;font-size:11px;color:var(--sub);margin-top:4px}
  .foot{margin-top:22px;font-size:10.5px;color:#3f5573;line-height:1.9;text-align:center}

  @media (max-width:380px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="back" href="index.html">‹</a>
    <div>
      <h1>来电号码自查</h1>
      <p>按号段规则判断，不查数据库，不装 App</p>
    </div>
  </header>

  <p class="lede">
    输入一个陌生号码，看看它<b>属于哪一类</b>。<br>
    我们不猜它是谁，只看这串数字<b>本身就说明了什么</b>。
  </p>

  <div class="inputbox">
    <label>输 入 号 码</label>
    <div class="field">
      <input id="num" type="tel" inputmode="numeric" placeholder="例如 13800000000 或 0471-4392110" autocomplete="off">
      <button class="btn" id="go">查</button>
    </div>
    <div class="quick">
      <span data-f="+1 202 555 0143">+1 开头</span>
      <span data-f="17012345678">170 开头</span>
      <span data-f="95 5588">95 开头</span>
      <span data-f="400 123 4567">400 开头</span>
      <span data-f="13800001234">普通手机</span>
    </div>
  </div>

  <div class="res" id="res"></div>

  <div class="t"><span>几个必须记住的官方号码</span></div>
  <div class="grid">
    <a class="oi" href="tel:96110"><b>96110</b><span>全国反诈预警专线</span></a>
    <a class="oi" href="tel:110"><b>110</b><span>报警</span></a>
    <a class="oi" href="tel:12348"><b>12348</b><span>公共法律服务</span></a>
    <a class="oi" href="tel:04714392110"><b>0471-4392110</b><span>校保卫处（赛罕）</span></a>
  </div>

  <p class="foot">
    号段规则来自公开通信管理信息与反诈宣传<br>
    判断结果仅供参考，最终以官方核实为准
  </p>
</div>

<script>
(function(){
  var input = document.getElementById('num');
  var go = document.getElementById('go');
  var res = document.getElementById('res');

  /* 常见官方号码（白名单） */
  var WHITE = {
    '110':'报警电话','120':'急救','119':'火警','122':'交通事故','96110':'全国反诈预警专线',
    '12348':'公共法律服务','12345':'政务热线','12315':'消费者投诉','12333':'人社服务',
    '95588':'工商银行','95533':'建设银行','95599':'农业银行','95566':'中国银行',
    '95555':'招商银行','95528':'浦发银行','95558':'中信银行','95595':'光大银行',
    '11183':'中国邮政','95511':'平安保险','95518':'人保财险','95500':'太平洋保险',
    '10086':'中国移动','10010':'中国联通','10000':'中国电信'
  };

  /* 虚拟运营商号段（诈骗高发，需警惕） */
  var VNO = ['170','171','162','165','167'];

  function clean(v){
    return (v || '').replace(/[^\d+]/g, '');
  }

  function analyze(raw){
    var v = clean(raw);
    if (!v) return null;

    var intl = /^(\+|00)/.test(v);
    var digits = v.replace(/^\+/, '').replace(/^00/, '');
    var started = digits.slice(0, 3);

    var out = { num: v, risk: 'mid', title: '', kind: '', why: [], acts: [] };

    // 1. 白名单（精确）
    var short = digits.slice(-11);
    if (WHITE[digits] || WHITE[short]){
      out.risk = 'low';
      out.title = '这是官方号码';
      out.kind = WHITE[digits] || WHITE[short];
      out.why.push('号码与公开的官方客服/服务号码一致。');
      out.why.push('但要注意：<b>号码可以伪造成官方号</b>，真正的官方不会主动要你转账、要验证码。');
      out.acts.push(['挂断后自己回拨', '用你原本就知道的官方号码回拨，不要回拨来电显示的那个。']);
      out.acts.push(['记住一条', '官方客服永远不需要你的<b>验证码、密码、屏幕共享</b>。']);
      return out;
    }

    // 2. 国际号
    if (intl){
      out.risk = 'high';
      out.title = '境外号码 · 极高风险';
      out.kind = '+ 或 00 开头 = 从境外呼入';
      out.why.push('境外号码是冒充公检法、冒充客服的高发来源。');
      out.why.push('如果你没有境外的亲友或业务，<b>这个电话基本可以直接挂</b>。');
      out.why.push('公检法不会用境外号码办案，也不会电话办案。');
      out.acts.push(['直接挂断', '不要回拨，不要按对方说的操作任何 App。']);
      out.acts.push(['对方说要抓你？', '一律假的。公安不会电话通知你“涉嫌洗钱”。']);
      out.acts.push(['拿不准就打 96110', '问一句，比转一笔强。']);
      return out;
    }

    // 3. 虚拟运营商
    if (VNO.indexOf(started) >= 0){
      out.risk = 'high';
      out.title = '虚拟运营商号段 · 高风险';
      out.kind = started + ' 开头，属于虚拟运营商转售号段';
      out.why.push('这类号段实名门槛低、开卡便宜，是诈骗电话的高发来源。');
      out.why.push('不是说每个都是骗子，但<b>陌生来电 + 要钱要信息</b>，风险明显更高。');
      out.acts.push(['先不接，或挂了回短信问', '让对方用文字说明来意，诈骗话术在文字里很难编圆。']);
      out.acts.push(['涉及钱就停', '任何要转账、要验证码的，直接终止。']);
      return out;
    }

    // 4. 95 开头
    if (/^95\d{3,}/.test(digits)){
      var len = digits.length;
      out.risk = 'mid';
      out.title = '95 开头 · 需要核实';
      out.kind = '95 号段，多为银行/保险/企业客服，但也被大量用于营销外呼';
      out.why.push('正规银行客服确实是 95 开头（如 95588 工行、95533 建行）。');
      out.why.push('但 <b>95 号段也被营销和外呼公司大量使用</b>，甚至有伪造的。');
      out.why.push('关键不看号段，看对方<b>要你做什么</b>：要验证码、要转账、要共享屏幕 = 假。');
      out.acts.push(['挂断，自己打银行卡背面那个号', '不要用对方给你的号码。']);
      out.acts.push(['官方客服不会让你转账', '“安全账户”“资金核查”一律是骗局。']);
      return out;
    }

    // 5. 400 开头
    if (/^400/.test(digits)){
      out.risk = 'mid';
      out.title = '400 号码 · 多半是外呼营销';
      out.kind = '400 是企业被叫付费号，原则上不用于主动外呼';
      out.why.push('正规企业一般不用 400 主动给你打电话。');
      out.why.push('如果你接到 400 自称“客服”，说订单异常、要退款、要理赔——<b>大概率是假的</b>。');
      out.acts.push(['挂断，去官方 App 查订单', '不要按对方说的加微信、下载 App、共享屏幕。']);
      return out;
    }

    // 6. 固话（含区号）
    if (/^0\d{2,3}/.test(digits)){
      var area = digits.slice(0, 4);
      out.risk = 'mid';
      out.title = '固定电话 · 需要核实';
      out.kind = '区号 ' + area + '（本地或外地固话）';
      out.why.push('固话可以被伪装，来电显示并不等于真实来源。');
      out.why.push('如果对方自称学校、银行、公安——<b>挂了，用你自己查到的号码回拨</b>。');
      out.acts.push(['回拨核实', '自己搜官方号码打过去，不要回拨来电记录。']);
      out.acts.push(['学校的事问辅导员', '辅导员本人是唯一可靠渠道。']);
      return out;
    }

    // 7. 普通手机号
    if (/^1\d{10}$/.test(digits)){
      out.risk = 'mid';
      out.title = '普通手机号 · 看它要什么';
      out.kind = '中国大陆手机号（可能是真人，也可能是买来的卡）';
      out.why.push('手机号本身说明不了什么，<b>关键看对方自称什么身份</b>。');
      out.why.push('如果对方自称“公检法、学校老师、银行、客服”，而用的是私人手机号——<b>100% 是假的</b>。');
      out.why.push('公检法不会用私人手机号办案，学校老师不会用私人号收钱。');
      out.acts.push(['问一句：你是哪个单位的？', '对方开始含糊、催你、不让你核实，就挂。']);
      out.acts.push(['别在电话里给任何信息', '学号、身份证、验证码，都不给。']);
      return out;
    }

    // 8. 短信通道等
    if (/^106/.test(digits)){
      out.risk = 'mid';
      out.title = '106 开头 · 短信通道';
      out.kind = '这是短信发送号段，不是电话';
      out.why.push('106 号段用于群发短信，内容真假要看<b>链接和落款</b>。');
      out.acts.push(['不点链接', '凡是短信里的短链接，一律不点。']);
      return out;
    }

    // 其他
    out.risk = 'mid';
    out.title = '不常见的号码格式';
    out.kind = '长度 ' + digits.length + ' 位';
    out.why.push('这个号码不符合常见的国内号码格式。');
    out.why.push('不常见的格式本身就是一种可疑信号。');
    out.acts.push(['直接挂断', '不要回拨。']);
    return out;
  }

  var RMAP = {
    high: { dot:'#ff5b5b', color:'#ff8b8b', text:'高 风 险' },
    mid:  { dot:'#ffbf47', color:'#ffd98a', text:'需 要 核 实' },
    low:  { dot:'#2fd39a', color:'#7fe3c2', text:'官 方 号 码' }
  };

  function render(r){
    var m = RMAP[r.risk];
    var h = '<div class="card ' + r.risk + '">';
    h += '<div class="lv"><span class="dot" style="background:' + m.dot + ';box-shadow:0 0 12px ' + m.dot + '99"></span>';
    h += '<b style="color:' + m.color + '">' + m.text + '</b></div>';
    h += '<div class="num">' + r.num + '</div>';
    h += '<div class="kind">' + r.title + ' · ' + r.kind + '</div>';
    h += '<div class="why">';
    r.why.forEach(function(w, i){
      h += '<div class="li"><i>' + (i+1) + '</i><div>' + w + '</div></div>';
    });
    h += '</div>';
    h += '<div class="acts"><h4>你 该 做 的</h4>';
    r.acts.forEach(function(a){
      h += '<div class="a"><b>·</b><div>' + a[0] + '：' + a[1] + '</div></div>';
    });
    h += '</div></div>';
    res.innerHTML = h;
    res.classList.add('on');
    res.scrollIntoView({behavior:'smooth', block:'center'});
  }

  function run(){
    var r = analyze(input.value);
    if (!r){
      res.innerHTML = '<div class="card"><div class="why">先输入一个号码，比如 <b>+1 202 555 0143</b> 或 <b>17012345678</b>。</div></div>';
      res.classList.add('on');
      return;
    }
    render(r);
  }

  go.addEventListener('click', run);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') run(); });
  document.querySelectorAll('.quick span').forEach(function(el){
    el.addEventListener('click', function(){
      input.value = el.getAttribute('data-f');
      run();
    });
  });
})();
</script>
</body>
</html>
