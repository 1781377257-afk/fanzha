<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反诈小安 · 工具页</title>
<style>
  :root{--bg1:#0b1220;--bg2:#111c33;--line:rgba(255,255,255,.10);--txt:#e8eefc;--sub:#93a4c3;--brand:#37b6ff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#17325e 0%,transparent 60%),
               linear-gradient(165deg,var(--bg1),var(--bg2) 55%,#0a1018);
    color:var(--txt);min-height:100vh;padding:40px 18px;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;justify-content:center;
  }
  .wrap{max-width:400px;margin:0 auto;width:100%}
  .logo{
    width:56px;height:56px;border-radius:17px;margin:0 auto 16px;
    background:linear-gradient(140deg,#37b6ff,#1a6fd4);
    display:grid;place-items:center;font-size:26px;font-weight:700;
    box-shadow:0 12px 30px rgba(55,182,255,.30);
  }
  h1{text-align:center;font-size:19px;font-weight:700;letter-spacing:.5px}
  .sub{text-align:center;font-size:12.5px;color:var(--sub);margin-top:7px;margin-bottom:30px;line-height:1.7}
  a.item{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;
    padding:18px 17px;margin-bottom:13px;transition:.2s;backdrop-filter:blur(12px);
  }
  a.item:active{transform:scale(.985);background:rgba(255,255,255,.075)}
  .ic{width:42px;height:42px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;background:rgba(55,182,255,.14)}
  .ic.r{background:rgba(255,107,107,.14)}
  .tx h3{font-size:14.5px;font-weight:600;margin-bottom:3px}
  .tx p{font-size:11.5px;color:var(--sub);line-height:1.6}
  .arw{margin-left:auto;color:#475569;font-size:17px}
  .foot{text-align:center;font-size:11px;color:#64748b;margin-top:24px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">安</div>
  <h1>反诈小安</h1>
  <p class="sub">内蒙古师范大学 · 校园反诈服务台</p>

  <a class="item" href="report.html">
    <div class="ic">📊</div>
    <div class="tx">
      <h3>我的防骗体检报告</h3>
      <p>演练结束后查看你的四维评分</p>
    </div>
    <span class="arw">›</span>
  </a>

  <a class="item" href="help.html">
    <div class="ic r">🚨</div>
    <div class="tx">
      <h3>本校反诈求助卡</h3>
      <p>派出所、保卫处、心理中心，一点就拨</p>
    </div>
    <span class="arw">›</span>
  </a>

  <p class="foot">两个页面都可以截图保存<br>信息来自学校官方公开渠道</p>
</div>
</body>
</html>
